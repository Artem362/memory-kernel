name: First-Run Feedback
description: Report what happened during your first install or first use of Memory Kernel.
title: "[First Run]: "
labels:
  - feedback
body:
  - type: dropdown
    id: install_source
    attributes:
      label: Install Source
      description: Where did you install the package from?
      options:
        - PyPI
        - TestPyPI
        - Local repository
        - Other
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: Package Version
      description: Example: amormorri-memory-kernel 0.1.0
      placeholder: amormorri-memory-kernel 0.1.0
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: Example: Python 3.12.10
      placeholder: Python 3.12.x
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Example: Windows 11, Ubuntu 24.04, macOS 15
      placeholder: Windows 11
    validations:
      required: true

  - type: textarea
    id: current_task
    attributes:
      label: What Were You Trying To Do?
      description: One short sentence is enough.
      placeholder: I wanted to install the package and save my first memory.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact Command
      description: Paste the command that failed or confused you.
      placeholder: |
        pip install amormorri-memory-kernel
        memory-kernel init
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
      placeholder: I expected the package to install and the CLI to initialize a local database.
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual Result
      placeholder: The install failed / the CLI command was not found / the output was confusing.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant Output
      description: Paste the most useful part of the terminal output.
      render: shell
      placeholder: Paste error text or unexpected output here.
    validations:
      required: false

  - type: textarea
    id: friction
    attributes:
      label: Biggest Point Of Friction
      description: What felt hardest or most confusing during the first run?
      placeholder: I did not know whether to install from PyPI or from source.
    validations:
      required: false
