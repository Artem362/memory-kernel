[package]
name = "memory-kernel-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
pyo3 = { version = "0.25.1", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[package.metadata.maturin]
python-source = "../src"
module-name = "memory_kernel._native"
